<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Google+Sans+Code:wght@400;500&display=swap">
<style>
/* Campus Hub — redesigned shell: fixed sidebar (Linear/ClickUp), catalog with filter rail (fal),
   booking with month calendar + time chips (Maze/Clockwise), admin tables (Linear/Zendesk), split login (7shifts). */
:root {
  --paper: #f4f6fa; --surface: #ffffff; --sunk: #e9eef5; --ink: #0f1a2e; --muted: #5a6778; --line: #d9e0ea; --line-strong: #bcc7d6;
  --accent: #1f5fd0; --accent-soft: #e3ecfc; --accent-ink: #163f8f; --on-accent: #ffffff;
  --ok: #1f7a4d; --ok-soft: #dcf2e4; --warn: #9a5b00; --warn-soft: #fbeccb; --bad: #c0392b; --bad-soft: #fbe1dd; --off: #6a7684; --off-soft: #e8ecf0;
  --grid: #dbe3ee;
  --f: "Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Google Sans Code", ui-monospace, Menlo, Consolas, monospace;
  --side: 236px; --r: 10px; --rs: 6px;
  /* Spacing scale per display class: phone → laptop → large laptop/desktop. */
  --gutter: 16px;   /* page side padding */
  --pad: 16px;      /* panel / card inner padding */
  --gap: 12px;      /* grid gaps */
  --section: 18px;  /* vertical rhythm between blocks */
  --content: 1080px;
}
@media (min-width: 861px)  { :root { --gutter: 28px; --pad: 20px; --gap: 14px; --section: 22px; } }
@media (min-width: 1280px) { :root { --gutter: 40px; --pad: 24px; --gap: 18px; --section: 26px; --content: 1280px; } }
@media (min-width: 1600px) { :root { --gutter: 56px; --pad: 28px; --gap: 22px; --section: 30px; --content: 1480px; --side: 260px; } body { font-size: 15.5px; } }
@media (min-width: 2000px) { :root { --gutter: 72px; --content: 1640px; } body { font-size: 16px; } }
/* Light is the default regardless of the OS setting; dark only when the user picks it from the top bar. */
:root { color-scheme: light; }
:root[data-theme="dark"] {
  --paper: #0d1320; --surface: #141c2b; --sunk: #1b2536; --ink: #e7ecf5; --muted: #93a0b4; --line: #27334a; --line-strong: #3a4862;
  --accent: #6d9cff; --accent-soft: #182a4d; --accent-ink: #b7ccff; --on-accent: #06142e;
  --ok: #5ccd91; --ok-soft: #143122; --warn: #e8ad4b; --warn-soft: #33260d; --bad: #f0796c; --bad-soft: #3a1a16; --off: #8e9aa8; --off-soft: #222b35;
  --grid: #243247; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f); font-size: 14.5px; line-height: 1.5; font-feature-settings: "tnum" 1; }
img { max-width: 100%; }
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
h1 { font-size: 1.6rem; font-weight: 700; line-height: 1.15; }
h2 { font-size: 1.05rem; font-weight: 600; }
h3 { font-size: 0.95rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 0.84em; }
.muted { color: var(--muted); }
.small { font-size: 0.82rem; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- App shell ---------- */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; transition: grid-template-columns 0.18s ease; }
.app.collapsed { --side: 64px; }
.side { position: sticky; top: 0; height: 100vh; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 12px; gap: 6px; overflow: hidden; }
.logo { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; font-weight: 700; font-size: 1.02rem; letter-spacing: -0.01em; white-space: nowrap; }
.logo .txt { min-width: 0; overflow: hidden; }
.logo .fold { margin-left: auto; border: 0; background: none; color: var(--muted); padding: 4px; border-radius: 4px; display: grid; place-items: center; }
.logo .fold:hover { background: var(--sunk); color: var(--ink); }
.logo .fold svg { width: 16px; height: 16px; transition: transform 0.18s ease; }
/* Collapsed: icons only; labels, counts and group titles hidden, tooltips via title. */
.collapsed .side { padding-inline: 10px; }
.collapsed .logo { padding-inline: 4px; flex-direction: column; gap: 10px; }
.collapsed .logo .txt, .collapsed .sgroup, .collapsed .side nav button span:not(.cnt), .collapsed .clockbox span, .collapsed .me .n { display: none; }
.collapsed .logo .fold { margin-left: 0; }
.collapsed .logo .fold svg { transform: rotate(180deg); }
.collapsed .side nav { padding-top: 8px; display: grid; gap: 2px; }
.collapsed .side nav button { justify-content: center; padding: 9px 0; position: relative; }
.collapsed .side nav button .cnt { position: absolute; top: 2px; right: 4px; margin: 0; font-size: 0.66rem; padding: 0 5px; background: var(--accent); color: var(--on-accent); }
.collapsed .clockbox { padding: 6px 4px; text-align: center; }
.collapsed .clockbox b { font-size: 0.72rem; white-space: nowrap; }
.collapsed .me { padding: 6px; flex-direction: column; gap: 6px; }
.collapsed .me button { margin-left: 0; }
.logo .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.logo .mark svg { width: 15px; height: 15px; }
.logo small { display: block; font-weight: 500; font-size: 0.72rem; color: var(--muted); letter-spacing: 0; }
.sgroup { font-size: 0.72rem; color: var(--muted); font-weight: 600; padding: 12px 8px 4px; }
.side nav button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; text-align: left; padding: 7px 8px; border-radius: var(--rs); color: var(--ink); font-weight: 500; }
.side nav button svg { width: 16px; height: 16px; color: var(--muted); flex: 0 0 auto; }
.side nav button:hover { background: var(--sunk); }
.side nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); }
.side nav button[aria-current="page"] svg { color: var(--accent-ink); }
.side nav button .cnt { margin-left: auto; font-size: 0.74rem; color: var(--muted); background: var(--sunk); padding: 0 7px; border-radius: 999px; }
.side nav button[aria-current="page"] .cnt { background: var(--surface); }
.side .bottom { margin-top: auto; display: grid; gap: 8px; }
.clockbox { border: 1px solid var(--line); border-radius: var(--rs); padding: 8px 10px; font-size: 0.78rem; color: var(--muted); display: grid; gap: 2px; }
.clockbox b { color: var(--ink); font-family: var(--mono); font-weight: 500; font-size: 0.86rem; }
.me { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--rs); border: 1px solid var(--line); }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--sunk); color: var(--ink); display: grid; place-items: center; font-weight: 600; font-size: 0.8rem; flex: 0 0 auto; }
.me .n { display: grid; min-width: 0; line-height: 1.2; }
.me .n span:first-child { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me .n span:last-child { font-size: 0.74rem; color: var(--muted); }
.me button { margin-left: auto; border: 0; background: none; color: var(--muted); padding: 4px; border-radius: 4px; }
.me button:hover { background: var(--sunk); color: var(--ink); }
.me button svg { width: 16px; height: 16px; display: block; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 10px var(--gutter); min-height: 52px; }
.topbar .crumb { color: var(--muted); font-size: 0.86rem; display: flex; gap: 6px; align-items: center; }
.topbar .crumb b { color: var(--ink); font-weight: 600; }
.topbar .spacer { flex: 1; }
.menubtn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: var(--rs); width: 34px; height: 32px; place-items: center; }
.menubtn svg { width: 18px; height: 18px; }
.iconbtn { position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: var(--rs); width: 34px; height: 32px; display: grid; place-items: center; }
.iconbtn svg { width: 17px; height: 17px; }
.badge { position: absolute; top: -6px; right: -6px; min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 10.5px; font-weight: 600; display: grid; place-items: center; }
.proto { font-size: 0.78rem; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.proto .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.proto button { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 2px 9px; font-size: 0.76rem; }
.content { padding: var(--section) var(--gutter) calc(var(--section) * 2); max-width: var(--content); width: 100%; margin-inline: auto; }

/* Notifications popover */
.notif { position: absolute; right: var(--gutter); top: calc(100% + 6px); width: min(380px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 16px 40px rgba(8, 18, 30, 0.16); max-height: 60vh; overflow: auto; }
.notif header { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; font-size: 0.86rem; }
.notif article { padding: 10px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; font-size: 0.86rem; }
.notif article:last-child { border-bottom: 0; }

/* ---------- Controls ---------- */
.btn { border: 1px solid var(--line-strong); background: var(--surface); padding: 7px 13px; border-radius: var(--rs); font-weight: 500; white-space: nowrap; line-height: 1.3; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); background: transparent; }
.btn.danger:hover { background: var(--bad-soft); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { padding: 4px 10px; font-size: 0.82rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.link { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 500; }
.link:hover { text-decoration: underline; }
label.f { display: grid; gap: 5px; font-size: 0.84rem; font-weight: 500; color: var(--ink); }
input[type=text], input[type=email], input[type=password], input[type=search], select, textarea {
  border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--rs); padding: 8px 10px; width: 100%; min-width: 0; font-weight: 400;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
textarea { resize: vertical; min-height: 92px; }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
.search input { padding-left: 32px; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.76rem; font-weight: 600; padding: 2px 9px 2px 7px; border-radius: 999px; white-space: nowrap; line-height: 1.5; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.ok { color: var(--ok); background: var(--ok-soft); }
.warn { color: var(--warn); background: var(--warn-soft); }
.bad { color: var(--bad); background: var(--bad-soft); }
.off { color: var(--off); background: var(--off-soft); }
.info { color: var(--accent-ink); background: var(--accent-soft); }

/* Inventory tag chip */
.tag { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 0.74rem; font-weight: 500; border: 1px solid var(--line-strong); border-radius: 4px; padding: 2px 7px 2px 5px; color: var(--ink); background: var(--surface); white-space: nowrap; }
.tag svg { width: 34px; height: 12px; color: var(--ink); }

/* ---------- Page pieces ---------- */
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: var(--section); }
.head p { color: var(--muted); margin-top: 6px; max-width: 60ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: var(--pad); display: grid; gap: var(--gap); align-content: start; min-width: 0; }
.panel > header { display: grid; gap: 4px; }
.panel > header p { color: var(--muted); font-size: 0.86rem; }
.cols { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(300px, 1fr); gap: var(--gap); align-items: start; }
@media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } }
.empty { padding: 34px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: var(--r); font-size: 0.9rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--gap); margin-bottom: var(--section); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: calc(var(--pad) * 0.65) var(--pad); display: grid; gap: 2px; }
.stat b { font-size: 1.35rem; font-weight: 600; letter-spacing: -0.02em; }
.stat span { font-size: 0.8rem; color: var(--muted); }

/* Catalog: rail + grid */
.catalog { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: calc(var(--gap) + 8px); align-items: start; }
@media (max-width: 760px) { .catalog { grid-template-columns: 1fr; } }
@media (min-width: 1600px) { .catalog { grid-template-columns: 230px minmax(0, 1fr); } }
.rail { display: grid; gap: var(--section); position: sticky; top: 72px; }
.rail h3 { font-size: 0.78rem; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.rail .opt { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; padding: 5px 8px; border-radius: var(--rs); color: var(--ink); }
.rail .opt:hover { background: var(--sunk); }
.rail .opt[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.rail .opt .cnt { margin-left: auto; font-size: 0.76rem; color: var(--muted); }
.rail .check { display: flex; gap: 8px; align-items: center; font-size: 0.86rem; padding: 4px 8px; }
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: var(--gap); }
.toolbar .search { flex: 1; }
.toolbar .count { font-size: 0.84rem; color: var(--muted); white-space: nowrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: var(--gap); }
@media (min-width: 1600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); } .card .art { height: 108px; } }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 0; display: grid; overflow: hidden; align-content: start; cursor: pointer; }
.card:hover { border-color: var(--line-strong); box-shadow: 0 6px 18px rgba(8, 18, 30, 0.07); }
.card .art { height: 92px; background: var(--sunk); display: grid; place-items: center; border-bottom: 1px solid var(--line); position: relative; }
.card .art svg { width: 44px; height: 44px; color: var(--muted); }
.card .art .pill { position: absolute; top: 10px; right: 10px; }
.card .body { padding: calc(var(--pad) * 0.7) calc(var(--pad) * 0.8) calc(var(--pad) * 0.8); display: grid; gap: 5px; }
.card .meta { font-size: 0.82rem; color: var(--muted); }
.card .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; font-size: 0.8rem; color: var(--muted); }

/* Asset page */
.back { margin-bottom: 14px; display: inline-flex; align-items: center; gap: 6px; }
.asset-head { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 16px; align-items: center; margin-bottom: var(--section); }
.asset-head .art { width: 72px; height: 72px; border-radius: var(--r); background: var(--sunk); border: 1px solid var(--line); display: grid; place-items: center; }
.asset-head .art svg { width: 36px; height: 36px; color: var(--muted); }
.asset-head .t { display: grid; gap: 6px; min-width: 0; }
.asset-head .line { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 0; font-size: 0.86rem; color: var(--muted); }
.facts span + span::before { content: "/"; margin: 0 8px; color: var(--line-strong); }
.callout { border: 1px solid var(--line); border-left: 3px solid var(--warn); background: var(--surface); border-radius: var(--rs); padding: 12px 14px; display: grid; gap: 6px; margin-bottom: 18px; font-size: 0.9rem; }
.callout ul { margin: 0; padding-left: 18px; }
.notice { font-size: 0.84rem; color: var(--warn); }

/* Booking: week grid (Mon–Sun × 08:00–20:00 in 30-min rows) + confirm card */
.panel { container-type: inline-size; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--rs); overflow: hidden; }
.seg label, .seg button { padding: 4px 11px; font-size: 0.82rem; border: 0; border-right: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.seg label:last-child, .seg button:last-child { border-right: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked), .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.wk-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.wk-head b { font-weight: 600; }
.wk-nav { display: flex; align-items: center; gap: 8px; }
.wk-nav button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 5px; width: 28px; height: 28px; display: grid; place-items: center; color: var(--muted); }
.wk-nav button:disabled { opacity: 0.35; cursor: default; }
.wk-nav button svg { width: 14px; height: 14px; }
.wk-nav .today { width: auto; padding: 0 10px; font-size: 0.8rem; color: var(--ink); }
.wk-wrap { overflow-x: auto; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); }
.wk { --row: 24px; display: grid; grid-template-columns: 54px repeat(7, minmax(84px, 1fr)); grid-template-rows: auto repeat(24, var(--row)); min-width: 680px; position: relative; }
@container (min-width: 820px) { .wk { --row: 28px; } }
.wk .dh { grid-row: 1; padding: 8px 4px; text-align: center; border-bottom: 1px solid var(--line-strong); border-left: 1px solid var(--line); font-size: 0.8rem; line-height: 1.2; color: var(--muted); display: grid; gap: 1px; position: sticky; top: 0; background: var(--surface); z-index: 3; }
.wk .dh b { color: var(--ink); font-weight: 600; font-size: 0.86rem; }
.wk .dh.sel { background: var(--accent); color: var(--on-accent); border-radius: 6px 6px 0 0; }
.wk .dh.sel b { color: var(--on-accent); }
.wk .dh.off { color: var(--line-strong); }
.wk .dh.off b { color: var(--muted); }
.wk .dh.now b::after { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-left: 5px; vertical-align: 2px; }
.wk .dh.sel.now b::after { background: var(--on-accent); }
.wk .th { grid-column: 1; font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; padding-right: 8px; line-height: 1; transform: translateY(-50%); position: relative; z-index: 2; }
.wk .th.first { transform: none; padding-top: 2px; }
.wk .c { border: 0; border-left: 1px solid var(--line); border-top: 1px solid var(--grid); background: transparent; padding: 0; margin: 0; min-width: 0; }
.wk .c.hr { border-top-color: var(--line-strong); }
.wk .c:hover:not(:disabled) { background: var(--accent-soft); }
.wk .c:disabled { cursor: not-allowed; }
.wk .c.off { background: repeating-linear-gradient(135deg, var(--sunk) 0 3px, transparent 3px 8px); }
.wk .c.past { background: var(--sunk); opacity: 0.6; }
.wk .c.first-col { border-left: 1px solid var(--line-strong); }
.wk .blk { pointer-events: none; z-index: 2; margin: 2px 3px; border-radius: 5px; font-size: 0.72rem; line-height: 1.25; display: grid; align-content: center; justify-items: center; text-align: center; padding: 2px 4px; overflow: hidden; font-variant-numeric: tabular-nums; }
.wk .blk b { font-weight: 600; }
.wk .blk.busy { background: var(--sunk); color: var(--muted); border: 1px solid var(--line-strong); }
.wk .blk.mine { background: var(--accent-soft); color: var(--accent-ink); border: 1px solid var(--accent); }
.wk .blk.sel { background: var(--accent); color: var(--on-accent); box-shadow: 0 4px 12px rgba(31, 95, 208, 0.35); font-size: 0.78rem; }
.wk .blk.sel.clash { background: var(--bad); box-shadow: 0 4px 12px rgba(192, 57, 43, 0.3); }
.wk .nowline { pointer-events: none; z-index: 2; height: 0; border-top: 2px solid var(--bad); align-self: start; position: relative; }
.wk .nowline::before { content: ""; position: absolute; left: -5px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }

.kv dd.pass .chk { background: var(--ok); }
.kv dd.fail .chk { background: var(--bad); }
.confirm .btn.primary { width: 100%; padding: 10px; font-size: 0.95rem; }

function barcode(seedText) {
  let x = 0, bars = '';
  for (const ch of seedText) {
    const c = ch.charCodeAt(0), w = 1 + (c % 2), g = 1;
    bars += `<rect x="${x}" y="0" width="${w}" height="12"/>`;
    x += w + g;
  }
  return `<svg viewBox="0 0 ${x} 12" preserveAspectRatio="none" fill="currentColor" aria-hidden="true">${bars}</svg>`;
}

// ---------- fake API ----------
const TITLES = { 400: 'Bad Request', 401: 'Unauthorized', 403: 'Forbidden', 404: 'Not Found', 409: 'Conflict', 413: 'Content Too Large' };
const fail = (status, code, detail, errors) => ({ status, code, detail, errors });
function api(method, path, fn, okMsg) {
  const res = fn() || { status: 200 };
  const entry = { at: new Date(), method, path, status: res.status, code: res.code || '' };
  if (res.status >= 400) {
    entry.body = { type: 'about:blank', title: TITLES[res.status], status: res.status, detail: res.detail, instance: path.split('?')[0], code: res.code };
    if (res.errors) entry.body.errors = res.errors;
    S.lastError = entry;
    toast(`${res.status} ${res.code}`, res.detail, true);
  } else if (okMsg) {
    toast(`${res.status} ${{ 200: 'OK', 201: 'Created', 204: 'No Content' }[res.status]}`, typeof okMsg === 'function' ? okMsg(res) : okMsg, false);
  }
  D.log.unshift(entry);
  return res;
}
function logEvent(text) { D.log.unshift({ at: new Date(), method: 'EVENT', path: text, status: '', code: '' }); }

let toastTimer;
function toast(code, msg, isErr) {
  const el = document.getElementById('toast');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.innerHTML = `<span class="code">${esc(code)}</span><span>${esc(msg)}</span>`;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.hidden = true), isErr ? 6500 : 4000);
}
function notify(userId, subject, body) { D.notes.unshift({ id: D.seq.note++, userId, subject, body, at: new Date(NOW), read: false }); }

// ---------- business rules ----------
const activeOn = (assetId, ignoreId = -1) => D.reservations.filter(r => r.assetId === assetId && ACTIVE.includes(r.status) && r.id !== ignoreId);
const overlap = (assetId, start, end, ignoreId = -1) => activeOn(assetId, ignoreId).find(r => r.start < end && r.end > start);
const isFree = (assetId, start, end, ignoreId) => !overlap(assetId, start, end, ignoreId);

function createReservation(u, assetId, start, end) {
  const a = asset(assetId);
  if (end <= start) return fail(400, 'INVALID_TIME_RANGE', 'The end time must be after the start time.');
  if (start < NOW) return fail(409, 'BOOKING_IN_PAST', 'This slot has already started. Pick a later time.');
  const mins = (end - start) / 60000;
  if (mins < RULES.minMin || mins > RULES.maxMin) return fail(400, 'INVALID_DURATION', 'A booking lasts between 30 minutes and 4 hours.');
  const daysAhead = Math.round((at(dkey(start)) - at(dkey(NOW))) / DAY_MS);
  if (daysAhead > RULES.horizonDays) return fail(409, 'BOOKING_TOO_FAR_AHEAD', 'You can book at most 14 days ahead.');
  const wd = start.getDay();
  if (wd === 0 || wd === 6 || start.getHours() < RULES.open || end > at(dkey(start), RULES.close + ':00')) return fail(409, 'OUTSIDE_OPENING_HOURS', 'Labs are open Monday to Friday, 08:00 to 20:00.');
  if (a.status !== 'AVAILABLE') return fail(409, 'ASSET_NOT_BOOKABLE', `${a.name} is ${LBL[a.status][0].toLowerCase()} and can't be booked right now.`);
  const o = overlap(assetId, start, end);
  if (o) return fail(409, 'RESERVATION_CONFLICT', `${a.name} is already booked between ${hm(o.start)} and ${hm(o.end)}.`);
  const mine = D.reservations.filter(r => r.userId === u.id && ACTIVE.includes(r.status)).length;
  if (u.role !== 'ADMIN' && mine >= RULES.maxActive) return fail(409, 'RESERVATION_LIMIT_REACHED', 'You already have 2 active reservations. Cancel one or wait until one ends.');
  const r = { id: D.seq.res++, userId: u.id, assetId, start, end, status: 'CONFIRMED' };
  D.reservations.push(r);
  return { status: 201, r };
}

const STRATEGIES = [
  ['SameModelStrategy', d => D.assets.filter(a => a.model === d.model)],
  ['SameCategoryStrategy', d => D.assets.filter(a => a.categoryId === d.categoryId)],
];
function runEngine(inc) {
  const damaged = asset(inc.assetId);
  logEvent(`AssetDamagedEvent(incidentId=${inc.id}, assetId=${damaged.id}) → reassignment engine`);
  const upcoming = D.reservations.filter(r => r.assetId === damaged.id && r.status === 'CONFIRMED' && r.start >= NOW).sort(byStart);
  const results = [];
  for (const r of upcoming) {
    let found = null, strategy = null;
    for (const [name, candidates] of STRATEGIES) {
      found = candidates(damaged)
        .filter(a => a.id !== damaged.id && a.status === 'AVAILABLE')
        .sort((a, b) => (a.labRoomId !== damaged.labRoomId) - (b.labRoomId !== damaged.labRoomId))
        .find(a => isFree(a.id, r.start, r.end, r.id));
      if (found) { strategy = name; break; }
    }
    const when = `${dlabel(r.start)}, ${hm(r.start)}–${hm(r.end)}`;
    if (found) {
      r.originalAssetId = r.originalAssetId ?? r.assetId;
      r.assetId = found.id;
      D.rlog.unshift({ id: D.seq.rlog++, incidentId: inc.id, reservationId: r.id, userId: r.userId, fromId: damaged.id, toId: found.id, outcome: 'REASSIGNED', strategy, at: new Date(NOW) });
      notify(r.userId, 'Your booking was moved', `${damaged.name} was reported broken. Your booking on ${when} is now on ${found.name} (${room(found.labRoomId).name}).`);
    } else {
      r.status = 'FORCE_CANCELLED';
      r.cancelReason = `${damaged.name} was reported broken and no matching item was free`;
      D.rlog.unshift({ id: D.seq.rlog++, incidentId: inc.id, reservationId: r.id, userId: r.userId, fromId: damaged.id, toId: null, outcome: 'FORCE_CANCELLED', strategy: null, at: new Date(NOW) });
      notify(r.userId, 'Your booking was cancelled', `${damaged.name} was reported broken and no matching item is free on ${when}. Please book another slot.`);
    }
    results.push({ r, found, strategy });
  }
  return results;
}

function reportIncident(u, assetId, description, severity, photo) {
  const a = asset(assetId);
  if (!description.trim()) return fail(400, 'VALIDATION_FAILED', 'Validation failed', [{ field: 'description', message: 'must not be blank' }]);
  if (a.status === 'RETIRED') return fail(409, 'ASSET_RETIRED', `${a.name} is retired, so it can't be reported.`);
  if (photo && photo.size > 5 * 1024 * 1024) return fail(413, 'PHOTO_TOO_LARGE', 'The photo is larger than 5 MB.');
  if (photo && !['image/jpeg', 'image/png', 'image/webp'].includes(photo.type)) return fail(400, 'INVALID_PHOTO_TYPE', 'Use a JPEG, PNG or WebP photo.');
  const inc = { id: D.seq.inc++, assetId, reportedById: u.id, description: description.trim(), severity, status: 'OPEN', createdAt: new Date(NOW), photo: photo?.url || null };
  D.incidents.push(inc);
  a.status = 'UNDER_MAINTENANCE';
  return { status: 201, inc };
}

// Booking: week grid. Rows are 30-min steps from 08:00 to 20:00 (24 rows), columns Mon–Sun.
const ROWS = (RULES.close - RULES.open) * 2;
const mondayOf = d => { const x = at(dkey(d)); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const durLabel = m => m < 60 ? `${m} min` : m % 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m / 60} h`;
function bookSel() {
  const b = S.book, start = at(b.day, b.start);
  return { start, end: new Date(start.getTime() + b.mins * 60000) };
}
function bookingPanel() {
  const a = asset(S.assetId), b = S.book;
  const today = at(dkey(NOW));
  const horizon = new Date(today.getTime() + RULES.horizonDays * DAY_MS);
  const wk = at(b.week);
  const days = Array.from({ length: 7 }, (_, i) => new Date(wk.getTime() + i * DAY_MS));
  const canPrev = wk > mondayOf(today);
  const canNext = new Date(wk.getTime() + 7 * DAY_MS) <= horizon;
  const { start, end } = bookSel();
  const clash = overlap(a.id, start, end);
  const rowOf = d => Math.round(((d - at(dkey(d), RULES.open + ':00')) / 60000) / 30); // 0..24
  let html = '<div class="dh" style="grid-column:1"></div>';
  days.forEach((d, i) => {
    const k = dkey(d), off = d.getDay() === 0 || d.getDay() === 6 || d < today || d > horizon;
    html += `<div class="dh ${k === b.day ? 'sel' : ''} ${off ? 'off' : ''} ${k === dkey(NOW) ? 'now' : ''}" style="grid-column:${i + 2}"><b>${WD[d.getDay()]}</b><span>${MO[d.getMonth()]} ${d.getDate()}</span></div>`;
  });
  for (let r = 0; r < ROWS; r++) {
    const m = RULES.open * 60 + r * 30, t = pad(Math.floor(m / 60)) + ':' + pad(m % 60);
    if (r % 2 === 0) html += `<div class="th ${r === 0 ? 'first' : ''}" style="grid-row:${r + 2}">${t}</div>`;
    days.forEach((d, i) => {
      const k = dkey(d), s = at(k, t), e = new Date(s.getTime() + 30 * 60000);
      const closed = d.getDay() === 0 || d.getDay() === 6 || d > horizon;
      const past = s < NOW;
      const busy = activeOn(a.id).some(x => x.start < e && x.end > s);
      const cls = closed ? 'off' : past ? 'past' : '';
      html += `<button type="button" class="c ${cls} ${r % 2 === 0 ? 'hr' : ''} ${i === 0 ? 'first-col' : ''}" style="grid-column:${i + 2};grid-row:${r + 2}" data-act="cell" data-day="${k}" data-time="${t}" ${closed || past || busy ? 'disabled' : ''} aria-label="${dlabel(d)} ${t}"${busy ? ' tabindex="-1"' : ''}></button>`;
    });
  }
  // Existing bookings as blocks
  activeOn(a.id).forEach(x => {
    const i = Math.round((at(dkey(x.start)) - wk) / DAY_MS);
    if (i < 0 || i > 6) return;
    const r0 = Math.max(0, rowOf(x.start)), r1 = Math.min(ROWS, rowOf(x.end));
    if (r1 <= r0) return;
    const mine = x.userId === S.me;
    html += `<div class="blk ${mine ? 'mine' : 'busy'}" style="grid-column:${i + 2};grid-row:${r0 + 2} / span ${r1 - r0}"><b>${hm(x.start)}–${hm(x.end)}</b><span>${mine ? 'Your booking' : 'Unavailable'}</span></div>`;
  });
  // Selection block
  { const i = Math.round((at(b.day) - wk) / DAY_MS);
    if (i >= 0 && i <= 6) { const r0 = rowOf(start), r1 = Math.min(ROWS, rowOf(end)); if (r1 > r0) html += `<div class="blk sel ${clash ? 'clash' : ''}" style="grid-column:${i + 2};grid-row:${r0 + 2} / span ${r1 - r0}"><b>${hm(start)}–${hm(end)}</b><span>${clash ? 'Overlaps' : 'Selected'}</span></div>`; } }
  // Now line
  { const i = Math.round((today - wk) / DAY_MS); const r = rowOf(NOW);
    if (i >= 0 && i <= 6 && r >= 0 && r < ROWS) { const frac = ((NOW - at(dkey(NOW), RULES.open + ':00')) / 60000 % 30) / 30; html += `<div class="nowline" style="grid-column:${i + 2};grid-row:${r + 2};margin-top:calc(var(--row) * ${frac.toFixed(2)})" title="Now ${hm(NOW)}"></div>`; } }
  return `<div class="wk-head">
      <div class="wk-nav"><button type="button" data-act="week" data-dir="-1" ${canPrev ? '' : 'disabled'} aria-label="Previous week">${I.l}</button><button type="button" class="today" data-act="week" data-dir="0">Today</button><button type="button" data-act="week" data-dir="1" ${canNext ? '' : 'disabled'} aria-label="Next week">${I.r}</button></div>
      <b>${MO[days[0].getMonth()]} ${days[0].getDate()} – ${days[6].getMonth() !== days[0].getMonth() ? MO[days[6].getMonth()] + ' ' : ''}${days[6].getDate()}, ${days[6].getFullYear()}</b>
      <div class="seg" role="group" aria-label="Duration">${[30, 60, 90, 120, 180, 240].map(m => `<button type="button" data-act="dur" data-mins="${m}" aria-pressed="${m === b.mins}">${m < 60 ? '30 min' : m % 60 ? m / 60 + 'h' : m / 60 + ' h'}</button>`).join('')}</div>
    </div>
    <div class="wk-wrap"><div class="wk" role="grid" aria-label="Week of ${dlabel(days[0])}">${html}</div></div>

    <p class="rules">Click a free cell to set the start. Slots last 30 min to 4 h, up to 14 days ahead; labs open Monday to Friday 08:00–20:00.</p>`;
}

function confirmCard() {
  const a = asset(S.assetId), b = S.book, u = me();
  const { start, end } = bookSel();
  const today = at(dkey(NOW)), horizon = new Date(today.getTime() + RULES.horizonDays * DAY_MS);
  const closeAt = at(b.day, RULES.close + ':00');
  const wd = start.getDay();
  const active = D.reservations.filter(r => r.userId === u.id && ACTIVE.includes(r.status)).length;
  const clash = overlap(a.id, start, end);
  const checks = [
    ['Lab hours', wd !== 0 && wd !== 6 && end <= closeAt && start >= NOW, wd === 0 || wd === 6 ? 'Closed at weekends' : start < NOW ? 'Slot already started' : end <= closeAt ? `Within ${pad(RULES.open)}:00–${RULES.close}:00` : `Ends after ${RULES.close}:00`],
    ['Max horizon', start <= new Date(horizon.getTime() + DAY_MS), `Bookable until ${dlabel(horizon)} (${RULES.horizonDays} days)`],
    ['Per-student limit', u.role === 'ADMIN' || active < RULES.maxActive, u.role === 'ADMIN' ? 'No limit for admins' : `${active} of ${RULES.maxActive} active reservations used`],
    ['Availability', !clash && a.status === 'AVAILABLE', a.status !== 'AVAILABLE' ? LBL[a.status][0] : clash ? `Overlaps ${hm(clash.start)}–${hm(clash.end)}` : 'Slot is free'],
  ];
  return `<section class="panel confirm"><h2>Confirm reservation</h2>
    <dl class="kv">
      <div><dt>Selected asset</dt><dd>${esc(a.name)}</dd></div>
      <div><dt>Lab room</dt><dd>${room(a.labRoomId).name}</dd></div>
      <div><dt>Date</dt><dd>${WD[start.getDay()]}, ${start.getDate()} ${MO[start.getMonth()]} ${start.getFullYear()}</dd></div>
      <div><dt>Time</dt><dd>${hm(start)} – ${hm(end)} (${durLabel(b.mins)})</dd></div>
      ${checks.map(([k, ok, msg]) => `<div><dt>${k}</dt><dd class="${ok ? 'pass' : 'fail'}"><span class="chk">${ok ? '✓' : '!'}</span>${msg}</dd></div>`).join('')}
    </dl>
    <button class="btn primary" data-act="book">Confirm booking</button>
  </section>`;
}

// ---------- events ----------
function go(view) { S.view = view; S.notifOpen = false; S.armed = null; S.sideOpen = false; render(); window.scrollTo(0, 0); }
function openAsset(id) {
  if (!S.book || S.book.assetId !== id) { const p = firstFree(id, 120); S.book = { assetId: id, day: p.day, week: dkey(mondayOf(at(p.day))), start: p.start, mins: 120 }; }
  S.assetId = id; S.photo = null;
  if (S.flash && S.flash.assetId !== id) S.flash = null;
  api('GET', `/api/v1/assets/${id}`, () => ({ status: 200 }));
  go('asset');
}
// First free start from `from` on, within opening hours and the horizon, that fits `mins`.
function firstFree(assetId, mins, from = NOW) {
  const today = at(dkey(NOW));
  for (let i = 0; i <= RULES.horizonDays; i++) {
    const d = new Date(today.getTime() + i * DAY_MS);
    if (d.getDay() === 0 || d.getDay() === 6) continue;
    for (let m = RULES.open * 60; m + mins <= RULES.close * 60; m += 30) {
      const t = pad(Math.floor(m / 60)) + ':' + pad(m % 60), s = at(dkey(d), t);
      if (s >= from && isFree(assetId, s, new Date(s.getTime() + mins * 60000))) return { day: dkey(d), start: t };
    }
  }
  return { day: dkey(today), start: pad(RULES.open) + ':00' };
}
const rerenderBooking = () => { const el = document.getElementById('bk'); if (el) el.innerHTML = bookingPanel(); const cf = document.getElementById('cf'); if (cf) cf.innerHTML = confirmCard(); };

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    if (S.notifOpen && !e.target.closest('.notif')) { S.notifOpen = false; render(); }
    else if (S.sideOpen && !e.target.closest('.side')) { S.sideOpen = false; document.getElementById('side').classList.remove('open'); }
    return;
  }
  const id = Number(el.dataset.id), act = el.dataset.act;
  if (act !== 'cancel' && act !== 'retire') S.armed = null;
  switch (act) {
    case 'go': go(el.dataset.view); break;
    case 'menu': S.sideOpen = !S.sideOpen; document.getElementById('side').classList.toggle('open', S.sideOpen); break;
    case 'theme':
      S.dark = !S.dark; applyTheme();
      try { localStorage.setItem('ch-theme', S.dark ? 'dark' : 'light'); } catch (_) {}
      render(); break;
    case 'fold':
      S.collapsed = !S.collapsed;
      try { localStorage.setItem('ch-side', S.collapsed ? '1' : '0'); } catch (_) {}
      render(); break;
    case 'open': openAsset(id); break;
    case 'tab': S.authTab = el.dataset.tab; render(); break;
    case 'quick': document.getElementById('a-email').value = el.dataset.email; document.getElementById('a-pass').value = 'password'; doLogin(); break;
    case 'logout': S.me = null; S.flash = null; S.book = null; S.authTab = 'login'; go('login'); break;
    case 'reset': D = seed(); S.flash = null; S.book = null; S.lastError = null; toast('Reset', 'Fake data restored to the starting state.', false); go(S.view === 'asset' ? 'catalog' : S.view); break;
    case 'notif': S.notifOpen = !S.notifOpen; render(); if (S.notifOpen) D.notes.filter(n => n.userId === S.me).forEach(n => (n.read = true)); break;
    case 'cat': S.cat = el.dataset.cat; render(); break;
    case 'cell': S.book.day = el.dataset.day; S.book.start = el.dataset.time; rerenderBooking(); break;
    case 'dur': S.book.mins = Number(el.dataset.mins); rerenderBooking(); break;
    case 'week': {
      const dir = Number(el.dataset.dir);
      S.book.week = dir === 0 ? dkey(mondayOf(NOW)) : dkey(new Date(at(S.book.week).getTime() + dir * 7 * DAY_MS));
      rerenderBooking(); break;
    }
    case 'book': {
      const b = S.book, { start, end } = bookSel();
      const res = api('POST', '/api/v1/reservations', () => createReservation(me(), b.assetId, start, end),
        r => `Booked ${asset(r.r.assetId).name}, ${dlabel(r.r.start)} ${hm(r.r.start)}–${hm(r.r.end)}.`);
      if (res.status === 201) { const p = firstFree(b.assetId, b.mins, end); b.day = p.day; b.start = p.start; b.week = dkey(mondayOf(at(p.day))); rerenderBooking(); } else render();
      break;
    }
    case 'cancel':
      if (S.armed !== 'c' + id) { S.armed = 'c' + id; render(); break; }
      S.armed = null;
      api('POST', `/api/v1/reservations/${id}/cancel`, () => {
        const r = D.reservations.find(x => x.id === id);
        if (r.status !== 'CONFIRMED' || r.start <= NOW) return fail(409, 'CANCELLATION_NOT_ALLOWED', 'This booking can no longer be cancelled.');
        r.status = 'CANCELLED'; r.cancelReason = 'Cancelled by the student';
        return { status: 204 };
      }, 'Booking cancelled. The slot is free for others.');
      render(); break;
    case 'checkout':
      api('POST', `/api/v1/admin/reservations/${id}/checkout`, () => {
        const r = D.reservations.find(x => x.id === id);
        if (NOW < new Date(r.start - 15 * 60000) || NOW > new Date(r.start.getTime() + 30 * 60000)) return fail(409, 'CHECKOUT_WINDOW_CLOSED', 'Pickup is possible from 15 minutes before the start until 30 minutes after.');
        r.status = 'CHECKED_OUT'; r.checkedOutAt = new Date(NOW);
        return { status: 200 };
      }, 'Checked out. The student has the item.');
      render(); break;
    case 'return':
      api('POST', `/api/v1/admin/reservations/${id}/return`, () => {
        const r = D.reservations.find(x => x.id === id);
        r.status = 'RETURNED'; r.returnedAt = new Date(NOW);
        return { status: 200 };
      }, 'Returned. The item is back on the shelf.');
      render(); break;
    case 'inc': {
      const op = el.dataset.op, note = document.getElementById('note-' + id)?.value.trim() || '';
      api('POST', `/api/v1/admin/incidents/${id}/${op}`, () => {
        const i = D.incidents.find(x => x.id === id), a = asset(i.assetId);
        if (op === 'start-repair') { i.status = 'IN_REPAIR'; return { status: 200 }; }
        i.status = op === 'resolve' ? 'RESOLVED' : 'REJECTED';
        i.resolutionNote = note || null;
        const others = D.incidents.some(x => x.assetId === a.id && x.id !== i.id && (x.status === 'OPEN' || x.status === 'IN_REPAIR'));
        if (!others && a.status === 'UNDER_MAINTENANCE') a.status = 'AVAILABLE';
        notify(i.reportedById, `Incident #${i.id} ${i.status === 'RESOLVED' ? 'resolved' : 'closed'}`, `${a.name}: ${note || (i.status === 'RESOLVED' ? 'fixed and back in service.' : 'no fault found.')}`);
        return { status: 200 };
      }, op === 'start-repair' ? 'Repair started.' : op === 'resolve' ? 'Resolved. The item is bookable again if nothing else is open on it.' : 'Rejected. The item is bookable again.');
      render(); break;
    }
    case 'retire':
      if (S.armed !== 'r' + id) { S.armed = 'r' + id; render(); break; }
      S.armed = null;
      api('POST', `/api/v1/admin/assets/${id}/retire`, () => { asset(id).status = 'RETIRED'; return { status: 200 }; }, `${asset(id).name} retired. Students no longer see it.`);
      render(); break;
    case 'nophoto': S.photo = null; render(); break;
  }
});

document.addEventListener('toggle', e => { if (e.target.id) S.det[e.target.id] = e.target.open; }, true);
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; refreshCatalog(); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'onlyFree') { S.onlyFree = t.checked; refreshCatalog(); }
  if (t.id === 'r-photo' && t.files[0]) {
    const file = t.files[0], reader = new FileReader();
    const desc = document.getElementById('r-desc').value;
    const sev = document.querySelector('input[name=sev]:checked').value;
    reader.onload = () => {
      S.photo = { name: file.name, size: file.size, type: file.type, url: reader.result };
      render();
      document.getElementById('r-desc').value = desc;
      document.querySelector(`input[name=sev][value=${sev}]`).checked = true;
    };
    reader.readAsDataURL(file);
  }
});

function doLogin() {
  const email = document.getElementById('a-email').value.trim().toLowerCase(), pass = document.getElementById('a-pass').value;
  const res = api('POST', '/api/v1/auth/login', () => {
    const u = D.users.find(x => x.email === email);
    if (!u || u.password !== pass) return fail(401, 'INVALID_CREDENTIALS', 'Email or password is wrong.');
    return { status: 200, u };
  });
  if (res.status === 200) { S.me = res.u.id; go(res.u.role === 'ADMIN' ? 'desk' : 'catalog'); toast('200 OK', `Signed in as ${res.u.fullName}. Token valid for 8 hours.`, false); }
  else render();
}

document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'auth') {
    if (S.authTab === 'login') return doLogin();
    const name = document.getElementById('a-name').value.trim(), email = document.getElementById('a-email').value.trim().toLowerCase(), pass = document.getElementById('a-pass').value;
    const res = api('POST', '/api/v1/auth/register', () => {
      const errors = [];
      if (!name || name.length > 100) errors.push({ field: 'fullName', message: 'size must be between 1 and 100' });
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) errors.push({ field: 'email', message: 'must be a well-formed email address' });
      if (pass.length < 8 || pass.length > 72) errors.push({ field: 'password', message: 'size must be between 8 and 72' });
      if (errors.length) return fail(400, 'VALIDATION_FAILED', errors.map(x => `${x.field} ${x.message}`).join('; '), errors);
      if (D.users.some(u => u.email === email)) return fail(409, 'EMAIL_TAKEN', 'An account with this email already exists. Sign in instead.');
      D.users.push({ id: D.users.length + 1, email, fullName: name, role: 'STUDENT', password: pass });
      return { status: 201 };
    }, 'Account created. Sign in with your new password.');
    if (res.status === 201) { S.authTab = 'login'; render(); document.getElementById('a-email').value = email; document.getElementById('a-pass').value = ''; document.getElementById('a-pass').focus(); }
    else render();
  }
  if (e.target.id === 'report') {
    const desc = document.getElementById('r-desc').value, sev = document.querySelector('input[name=sev]:checked').value;
    const res = api('POST', '/api/v1/incidents', () => reportIncident(me(), S.assetId, desc, sev, S.photo), 'Problem reported. Thank you.');
    if (res.status === 201) {
      const results = runEngine(res.inc);
      S.flash = { assetId: S.assetId, incidentId: res.inc.id, results };
      S.photo = null;
      render(); window.scrollTo(0, 0);
    } else { render(); document.getElementById('r-desc').value = desc; }
  }
  if (e.target.id === 'add') {
    const v = id => document.getElementById(id).value.trim();
    const res = api('POST', '/api/v1/admin/assets', () => {
      const errors = ['name', 'model', 'serial'].filter(f => !v('n-' + f)).map(f => ({ field: f === 'serial' ? 'serialNumber' : f, message: 'must not be blank' }));
      if (errors.length) return fail(400, 'VALIDATION_FAILED', errors.map(x => `${x.field} ${x.message}`).join('; '), errors);
      if (D.assets.some(a => a.serial.toLowerCase() === v('n-serial').toLowerCase())) return fail(409, 'SERIAL_NUMBER_TAKEN', `Serial number ${v('n-serial')} is already in the inventory.`);
      const a = { id: D.seq.asset++, name: v('n-name'), model: v('n-model'), serial: v('n-serial'), categoryId: Number(v('n-cat')), labRoomId: Number(v('n-room')), status: 'AVAILABLE' };
      D.assets.push(a);
      return { status: 201, a };
    }, r => `${r.a.name} added as ${tagNo(r.a.id)}.`);
    render();
  }
});

render();
</script>
