    <text x="32" y="64" font-size="12.5" fill="#475569">1,221 automated backend tests across 113 test classes  ·  Test code (29.6k lines) is 2.16x larger than backend prod code (13.7k)</text>

    <!-- Summary pill on top right -->
    <rect x="968" y="24" width="204" height="30" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.25"/>
    <circle cx="984" cy="39" r="4" fill="#2563eb"/>
    <text x="995" y="43" font-size="11.5" font-weight="700" fill="#1e3a8a">2.16x test-to-prod ratio</text>
  </g>

