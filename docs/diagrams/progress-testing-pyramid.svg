    <polygon points="96,293 246,293 261,355 81,355" fill="#0f172a" opacity="0.06"/>
    <polygon points="93,290 243,290 258,352 78,352" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.75" stroke-linejoin="round"/>
