    <text x="740" y="461" font-size="12" font-weight="700" fill="#14532d">End-to-End &amp; Security Verification</text>

    <text x="720" y="483" font-size="10.5" fill="#166534">• <tspan font-weight="700" fill="#14532d">DemoFlowIT:</tspan> runs full student-to-reassignment demo over HTTP</text>
    <text x="720" y="503" font-size="10.5" fill="#166534">• <tspan font-weight="700" fill="#14532d">SecurityPassIT:</tspan> IDOR probes, admin prefix checks, zero stack traces</text>
