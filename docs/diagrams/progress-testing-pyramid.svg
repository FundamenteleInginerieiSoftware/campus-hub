    <text x="168" y="457" font-size="18" font-weight="800" fill="#1e3a8a" text-anchor="middle">796</text>
    <text x="168" y="477" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="&quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace">Mockito · 65%</text>

