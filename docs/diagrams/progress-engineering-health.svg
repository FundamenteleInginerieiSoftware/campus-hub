    <!-- Row 7: infra (6, 2.5%, width=21) -->
    <g id="row-infra">
      <rect x="628" y="401" width="76" height="20" rx="5" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
      <text x="666" y="414.5" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#075985">infra</text>
      <rect x="716" y="403" width="320" height="16" rx="5" fill="#f1f5f9"/>
      <rect x="716" y="403" width="21" height="16" rx="5" fill="#0284c7"/>
      <text x="1074" y="415" text-anchor="end" class="sans" font-size="12.5" font-weight="700" fill="#0f172a">6</text>
      <text x="1082" y="415" class="sans" font-size="11.5" font-weight="500" fill="#64748b">(2.5%)</text>
      <text x="716" y="433" class="sans" font-size="10.5" fill="#64748b">Terraform AWS, Docker &amp; deploy OIDC</text>
      <line x1="628" y1="440" x2="1154" y2="440" stroke="#f1f5f9" stroke-width="1"/>
