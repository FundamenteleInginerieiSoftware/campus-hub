      <text x="666" y="162.5" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#1e3a8a">feat</text>
      <rect x="716" y="151" width="320" height="16" rx="5" fill="#f1f5f9"/>
      <rect x="716" y="151" width="320" height="16" rx="5" fill="#2563eb"/>
      <text x="1074" y="163" text-anchor="end" class="sans" font-size="12.5" font-weight="700" fill="#0f172a">91</text>
      <text x="1082" y="163" class="sans" font-size="11.5" font-weight="500" fill="#64748b">(37.8%)</text>
      <text x="716" y="181" class="sans" font-size="10.5" fill="#64748b">New backend &amp; frontend capabilities</text>
      <line x1="628" y1="188" x2="1154" y2="188" stroke="#f1f5f9" stroke-width="1"/>
    </g>

    <!-- Row 2: docs (58, 24.1%, width=204) -->
    <g id="row-docs">
      <rect x="628" y="191" width="76" height="20" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="666" y="204.5" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#334155">docs</text>
      <rect x="716" y="193" width="320" height="16" rx="5" fill="#f1f5f9"/>
      <rect x="716" y="193" width="204" height="16" rx="5" fill="#64748b"/>
      <text x="1074" y="205" text-anchor="end" class="sans" font-size="12.5" font-weight="700" fill="#0f172a">58</text>
      <text x="1082" y="205" class="sans" font-size="11.5" font-weight="500" fill="#64748b">(24.1%)</text>
      <text x="716" y="223" class="sans" font-size="10.5" fill="#64748b">Specs, ADRs, API contract &amp; personal notes</text>
      <line x1="628" y1="230" x2="1154" y2="230" stroke="#f1f5f9" stroke-width="1"/>
    </g>

    <!-- Row 3: fix (56, 23.2%, width=197) -->
    <g id="row-fix">
      <rect x="628" y="233" width="76" height="20" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="666" y="246.5" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#991b1b">fix</text>
      <rect x="716" y="235" width="320" height="16" rx="5" fill="#f1f5f9"/>
      <rect x="716" y="235" width="197" height="16" rx="5" fill="#ef4444"/>
      <text x="1074" y="247" text-anchor="end" class="sans" font-size="12.5" font-weight="700" fill="#dc2626">56</text>
      <text x="1082" y="247" class="sans" font-size="11.5" font-weight="500" fill="#64748b">(23.2%)</text>
      <text x="716" y="265" class="sans" font-size="10.5" fill="#64748b">Bug fixes, race locks &amp; review hardening</text>
      <line x1="628" y1="272" x2="1154" y2="272" stroke="#f1f5f9" stroke-width="1"/>
    </g>

    <!-- Row 4: test (14, 5.8%, width=49) -->
    <g id="row-test">
      <rect x="628" y="275" width="76" height="20" rx="5" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
      <text x="666" y="288.5" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#78350f">test</text>
      <rect x="716" y="277" width="320" height="16" rx="5" fill="#f1f5f9"/>
      <rect x="716" y="277" width="49" height="16" rx="5" fill="#d97706"/>
      <text x="1074" y="289" text-anchor="end" class="sans" font-size="12.5" font-weight="700" fill="#0f172a">14</text>
      <text x="1082" y="289" class="sans" font-size="11.5" font-weight="500" fill="#64748b">(5.8%)</text>
      <text x="716" y="307" class="sans" font-size="10.5" fill="#64748b">Dedicated PIT, ArchUnit &amp; concurrency PRs</text>
      <line x1="628" y1="314" x2="1154" y2="314" stroke="#f1f5f9" stroke-width="1"/>
    </g>

    <!-- Row 5: chore (7, 2.9%, width=25) -->
    <g id="row-chore">
      <rect x="628" y="317" width="76" height="20" rx="5" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
      <text x="666" y="330.5" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#134e4a">chore</text>
      <rect x="716" y="319" width="320" height="16" rx="5" fill="#f1f5f9"/>
      <rect x="716" y="319" width="25" height="16" rx="5" fill="#0d9488"/>
      <text x="1074" y="331" text-anchor="end" class="sans" font-size="12.5" font-weight="700" fill="#0f172a">7</text>
      <text x="1082" y="331" class="sans" font-size="11.5" font-weight="500" fill="#64748b">(2.9%)</text>
      <text x="716" y="349" class="sans" font-size="10.5" fill="#64748b">Build, config &amp; repo hygiene</text>
      <line x1="628" y1="356" x2="1154" y2="356" stroke="#f1f5f9" stroke-width="1"/>
    </g>

    <!-- Row 6: refactor (7, 2.9%, width=25) -->
    <g id="row-refactor">
      <rect x="628" y="359" width="76" height="20" rx="5" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
      <text x="666" y="372.5" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#4c1d95">refactor</text>
      <rect x="716" y="361" width="320" height="16" rx="5" fill="#f1f5f9"/>
      <rect x="716" y="361" width="25" height="16" rx="5" fill="#7c3aed"/>
      <text x="1074" y="373" text-anchor="end" class="sans" font-size="12.5" font-weight="700" fill="#0f172a">7</text>
      <text x="1082" y="373" class="sans" font-size="11.5" font-weight="500" fill="#64748b">(2.9%)</text>
      <text x="716" y="391" class="sans" font-size="10.5" fill="#64748b">Service splits &amp; code simplification</text>
      <line x1="628" y1="398" x2="1154" y2="398" stroke="#f1f5f9" stroke-width="1"/>
