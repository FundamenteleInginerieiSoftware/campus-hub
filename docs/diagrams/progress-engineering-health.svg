    <!-- Row 8: ci (2, 0.8%, width=7) -->
    <g id="row-ci">
      <rect x="628" y="443" width="76" height="20" rx="5" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
      <text x="666" y="456.5" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#065f46">ci</text>
      <rect x="716" y="445" width="320" height="16" rx="5" fill="#f1f5f9"/>
      <rect x="716" y="445" width="7" height="16" rx="3.5" fill="#059669"/>
      <text x="1074" y="457" text-anchor="end" class="sans" font-size="12.5" font-weight="700" fill="#0f172a">2</text>
      <text x="1082" y="457" class="sans" font-size="11.5" font-weight="500" fill="#64748b">(0.8%)</text>
      <text x="716" y="475" class="sans" font-size="10.5" fill="#64748b">GitHub Actions workflows &amp; guards</text>
