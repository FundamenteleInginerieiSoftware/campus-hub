    <!-- Bottom Note -->
    <rect x="628" y="490" width="526" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.1"/>
    <rect x="631" y="496" width="3.5" height="34" rx="1.75" fill="#ef4444"/>
    <text x="645" y="509" class="sans" font-size="11" fill="#475569"><tspan font-weight="700" fill="#0f172a">Over 31% of all merged PRs</tspan> are dedicated to bug fixes, tests,</text>
    <text x="645" y="525" class="sans" font-size="11" fill="#475569">and refactoring — not just new features.</text>
  </g>
</svg>
