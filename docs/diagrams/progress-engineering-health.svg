      <line x1="796" y1="146" x2="796" y2="480"/>
      <line x1="876" y1="146" x2="876" y2="480"/>
      <line x1="956" y1="146" x2="956" y2="480"/>
      <line x1="1036" y1="146" x2="1036" y2="480"/>
