    <rect x="614" y="96" width="562" height="460" rx="14" fill="#0f172a" opacity="0.06"/>
    <!-- Card frame -->
    <rect x="610" y="92" width="562" height="460" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Header band -->
    <path d="M 610 106 Q 610 92 624 92 L 1158 92 Q 1172 92 1172 106 L 1172 134 L 610 134 Z" fill="#f8fafc"/>
    <line x1="610" y1="134" x2="1172" y2="134" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="628" cy="113" r="4.5" fill="#7c3aed"/>
    <text x="642" y="118" class="sans" font-size="14.5" font-weight="700" fill="#0f172a">Merged PR Mix by Conventional Type (241 Post-Reset)</text>

