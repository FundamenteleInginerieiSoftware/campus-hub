<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Who Owns What — Module Ownership and Public Contracts</title>
  <desc id="diagram-desc">2x2 ownership map for the 4-person Campus Equipment and Incident Hub team showing Matei Necula, Liviu Nedelcu, Stefania, and Calin Murariu, plus their 7 ArchUnit-enforced cross-module APIs and domain events.</desc>

  <defs>
    <!-- Subtle Excalidraw-inspired dot grid -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.85" fill="#cbd5e1" opacity="0.5"/>
    </pattern>

    <!-- Clip path for dot grid inside rounded canvas -->
    <clipPath id="canvas-clip">
      <rect x="0" y="0" width="1200" height="780" rx="16"/>
    </clipPath>

    <!-- Bidirectional arrow markers (SVG 1.1 + SVG 2 safe) -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 9 1.5 L 1.5 5 L 9 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Explicit solid light canvas for GitHub Light & Dark Mode legibility -->
  <rect x="0" y="0" width="1200" height="780" rx="16" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="780" fill="url(#dot-grid)" clip-path="url(#canvas-clip)"/>

  <!-- ==================== HEADER (y=18..74) ==================== -->
  <g font-family='"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif'>
    <text x="28" y="42" font-size="20" font-weight="700" fill="#0f172a">Who Owns What — Module Ownership &amp; Public Contracts</text>
    <text x="28" y="64" font-size="12.5" font-weight="400" fill="#475569">Each teammate owns clear vertical slices (backend + frontend + tests); modules talk only via public api/ facades &amp; events (28 ArchUnit rules)</text>
    <line x1="28" y1="78" x2="1172" y2="78" stroke="#e2e8f0" stroke-width="1"/>
  </g>

  <!-- ==================== 2x2 QUADRANT CARDS ==================== -->
  <g font-family='"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif'>

    <!-- ========== TOP-LEFT: MATEI NECULA (Blue) x=28..556, y=92..340 ========== -->
    <g id="card-matei">
      <!-- Offset shadow -->
      <rect x="32" y="96" width="528" height="248" rx="12" fill="#0f172a" opacity="0.06"/>
      <!-- Card body -->
      <rect x="28" y="92" width="528" height="248" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <!-- Header strip (top rounded corners only) -->
      <path d="M 40 92 H 544 A 12 12 0 0 1 556 104 V 142 H 28 V 104 A 12 12 0 0 1 40 92 Z" fill="#2563eb"/>
      <text x="46" y="115" font-size="15.5" font-weight="700" fill="#ffffff">Matei Necula</text>
      <text x="46" y="133" font-size="11.5" font-weight="500" fill="#dbeafe">Cloud, Security, Auth &amp; Projects</text>
      <!-- GitHub handle pill -->
      <rect x="424" y="102" width="116" height="22" rx="11" fill="#ffffff" fill-opacity="0.18"/>
      <text x="482" y="116.5" text-anchor="middle" font-family='"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="11" font-weight="600" fill="#ffffff">@matei-necula</text>

      <!-- Section 1: Backend -->
      <rect x="44" y="152" width="3" height="44" rx="1.5" fill="#3b82f6"/>
      <text x="54" y="162" font-size="11.5" font-weight="700" fill="#1e3a8a">Backend (9 endpoints):</text>
      <text x="54" y="179" font-size="11.5" fill="#1e293b">config/ (SecurityConfig), user/ (JWT auth, pickup pass),</text>
      <text x="54" y="195" font-size="11.5" fill="#1e293b">project/ (bilingual kits), S3 &amp; SES prod adapters</text>

      <line x1="44" y1="206" x2="540" y2="206" stroke="#2563eb" stroke-opacity="0.18" stroke-width="1"/>

      <!-- Section 2: Frontend -->
      <rect x="44" y="215" width="3" height="44" rx="1.5" fill="#3b82f6"/>
      <text x="54" y="225" font-size="11.5" font-weight="700" fill="#1e3a8a">Frontend (4 pages):</text>
      <text x="54" y="242" font-size="11.5" fill="#1e293b">Projects, Project Details, Pickup Pass (QR),</text>
      <text x="54" y="258" font-size="11.5" fill="#1e293b">Admin Reservations Desk</text>

      <line x1="44" y1="269" x2="540" y2="269" stroke="#2563eb" stroke-opacity="0.18" stroke-width="1"/>

      <!-- Section 3: Platform & Quality -->
      <rect x="44" y="278" width="3" height="44" rx="1.5" fill="#3b82f6"/>
      <text x="54" y="288" font-size="11.5" font-weight="700" fill="#1e3a8a">Platform &amp; Quality:</text>
      <text x="54" y="305" font-size="11.5" fill="#1e293b">Gradle/build, Docker, Terraform AWS, deploy.yml (OIDC),</text>
      <text x="54" y="321" font-size="11.5" fill="#1e293b">DemoFlowIT, SecurityPassIT, PIT mutation setup</text>
    </g>

    <!-- ========== TOP-RIGHT: LIVIU NEDELCU (Teal) x=644..1172, y=92..340 ========== -->
    <g id="card-liviu">
      <!-- Offset shadow -->
      <rect x="648" y="96" width="528" height="248" rx="12" fill="#0f172a" opacity="0.06"/>
      <!-- Card body -->
      <rect x="644" y="92" width="528" height="248" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
      <!-- Header strip -->
      <path d="M 656 92 H 1160 A 12 12 0 0 1 1172 104 V 142 H 644 V 104 A 12 12 0 0 1 656 92 Z" fill="#0d9488"/>
      <text x="662" y="115" font-size="15.5" font-weight="700" fill="#ffffff">Liviu Nedelcu</text>
      <text x="662" y="133" font-size="11.5" font-weight="500" fill="#ccfbf1">Catalog &amp; Shared Services</text>
      <!-- GitHub handle pill -->
      <rect x="1072" y="102" width="84" height="22" rx="11" fill="#ffffff" fill-opacity="0.18"/>
      <text x="1114" y="116.5" text-anchor="middle" font-family='"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="11" font-weight="600" fill="#ffffff">@NliviuN</text>

      <!-- Section 1: Backend -->
      <rect x="660" y="152" width="3" height="44" rx="1.5" fill="#14b8a6"/>
      <text x="670" y="162" font-size="11.5" font-weight="700" fill="#134e4a">Backend (15 endpoints):</text>
      <text x="670" y="179" font-size="11.5" fill="#1e293b">catalog/ (CRUD, retire, search, row lock), common/</text>
      <text x="670" y="195" font-size="11.5" fill="#1e293b">(error, paging, audit), storage/ (local), notification/ (SSE)</text>

      <line x1="660" y1="206" x2="1156" y2="206" stroke="#0d9488" stroke-opacity="0.18" stroke-width="1"/>

      <!-- Section 2: Frontend -->
      <rect x="660" y="215" width="3" height="44" rx="1.5" fill="#14b8a6"/>
      <text x="670" y="225" font-size="11.5" font-weight="700" fill="#134e4a">Frontend (4 pages + live):</text>
      <text x="670" y="242" font-size="11.5" fill="#1e293b">Catalog, Asset Details, Admin Inventory,</text>
      <text x="670" y="258" font-size="11.5" fill="#1e293b">Admin Audit Log, SSE client &amp; &lt;LiveToasts /&gt;</text>

      <line x1="660" y1="269" x2="1156" y2="269" stroke="#0d9488" stroke-opacity="0.18" stroke-width="1"/>

      <!-- Section 3: Shared Foundations -->
      <rect x="660" y="278" width="3" height="44" rx="1.5" fill="#14b8a6"/>
      <text x="670" y="288" font-size="11.5" font-weight="700" fill="#134e4a">Shared Foundations:</text>
      <text x="670" y="305" font-size="11.5" fill="#1e293b">GlobalExceptionHandler (RFC 9457),</text>
      <text x="670" y="321" font-size="11.5" fill="#1e293b">PageResponse, CatalogSeeder (36 units)</text>
    </g>

    <!-- ========== BOTTOM-LEFT: STEFANIA (Violet) x=28..556, y=388..636 ========== -->
    <g id="card-stefania">
      <!-- Offset shadow -->
      <rect x="32" y="392" width="528" height="248" rx="12" fill="#0f172a" opacity="0.06"/>
      <!-- Card body -->
      <rect x="28" y="388" width="528" height="248" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
      <!-- Header strip -->
      <path d="M 40 388 H 544 A 12 12 0 0 1 556 400 V 438 H 28 V 400 A 12 12 0 0 1 40 388 Z" fill="#7c3aed"/>
      <text x="46" y="411" font-size="15.5" font-weight="700" fill="#ffffff">Stefania</text>
      <text x="46" y="429" font-size="11.5" font-weight="500" fill="#ede9fe">Incidents, Users &amp; Frontend Lead</text>
      <!-- GitHub handle pill -->
      <rect x="404" y="398" width="136" height="22" rx="11" fill="#ffffff" fill-opacity="0.18"/>
      <text x="472" y="412.5" text-anchor="middle" font-family='"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="11" font-weight="600" fill="#ffffff">@m1runa-stefan1a</text>

      <!-- Section 1: Backend -->
      <rect x="44" y="446" width="3" height="44" rx="1.5" fill="#8b5cf6"/>
      <text x="54" y="456" font-size="11.5" font-weight="700" fill="#4c1d95">Backend (15 endpoints):</text>
      <text x="54" y="473" font-size="11.5" fill="#1e293b">incident/ (reports, photos, triage, severity/limit,</text>
      <text x="54" y="489" font-size="11.5" fill="#1e293b">ReliabilityCalculator), user/admin/, common/security (CurrentUser)</text>

      <line x1="44" y1="499" x2="540" y2="499" stroke="#7c3aed" stroke-opacity="0.18" stroke-width="1"/>

      <!-- Section 2: Frontend Lead -->
      <rect x="44" y="507" width="3" height="60" rx="1.5" fill="#8b5cf6"/>
      <text x="54" y="517" font-size="11.5" font-weight="700" fill="#4c1d95">Frontend Lead (10 pages):</text>
      <text x="54" y="534" font-size="11.5" fill="#1e293b">React/Vite/Mantine scaffold, AppLayout, Login,</text>
      <text x="54" y="550" font-size="11.5" fill="#1e293b">Register, My Incidents, Incident Details, Incident Queue,</text>
      <text x="54" y="566" font-size="11.5" fill="#1e293b">Admin Users, Reassignment Log, Equipment Health</text>

      <line x1="44" y1="576" x2="540" y2="576" stroke="#7c3aed" stroke-opacity="0.18" stroke-width="1"/>

      <!-- Section 3: CI -->
      <rect x="44" y="585" width="3" height="30" rx="1.5" fill="#8b5cf6"/>
      <text x="54" y="595" font-size="11.5" font-weight="700" fill="#4c1d95">CI:</text>
      <text x="54" y="613" font-size="11.5" fill="#1e293b">.github/workflows/ci.yml (backend tests + frontend lint &amp; build)</text>
    </g>

    <!-- ========== BOTTOM-RIGHT: CALIN MURARIU (Amber) x=644..1172, y=388..636 ========== -->
    <g id="card-calin">
      <!-- Offset shadow -->
      <rect x="648" y="392" width="528" height="248" rx="12" fill="#0f172a" opacity="0.06"/>
      <!-- Card body -->
      <rect x="644" y="388" width="528" height="248" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
      <!-- Header strip -->
      <path d="M 656 388 H 1160 A 12 12 0 0 1 1172 400 V 438 H 644 V 400 A 12 12 0 0 1 656 388 Z" fill="#d97706"/>
      <text x="662" y="411" font-size="15.5" font-weight="700" fill="#ffffff">Calin Murariu</text>
      <text x="662" y="429" font-size="11.5" font-weight="500" fill="#fef3c7">Reservations, Reassignment &amp; Architecture</text>
      <!-- GitHub handle pill -->
      <rect x="1078" y="398" width="78" height="22" rx="11" fill="#ffffff" fill-opacity="0.18"/>
      <text x="1117" y="412.5" text-anchor="middle" font-family='"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace' font-size="11" font-weight="600" fill="#ffffff">@Swiorx</text>

      <!-- Section 1: Backend -->
      <rect x="660" y="446" width="3" height="60" rx="1.5" fill="#f59e0b"/>
      <text x="670" y="456" font-size="11.5" font-weight="700" fill="#78350f">Backend (30 endpoints):</text>
      <text x="670" y="473" font-size="11.5" fill="#1e293b">reservation/ (overlap locks, bundles, holds, transfers,</text>
      <text x="670" y="489" font-size="11.5" fill="#1e293b">sweeps, .ics feed), reassignment/ (Strategy + Observer, simulator),</text>
      <text x="670" y="505" font-size="11.5" fill="#1e293b">common/time (Clock)</text>

      <line x1="660" y1="515" x2="1156" y2="515" stroke="#d97706" stroke-opacity="0.18" stroke-width="1"/>

      <!-- Section 2: Frontend -->
      <rect x="660" y="523" width="3" height="44" rx="1.5" fill="#f59e0b"/>
      <text x="670" y="533" font-size="11.5" font-weight="700" fill="#78350f">Frontend (2 pages + UI):</text>
      <text x="670" y="550" font-size="11.5" fill="#1e293b">My Reservations, Calendar Sync,</text>
      <text x="670" y="566" font-size="11.5" fill="#1e293b">CalendarBookingView, QuickBookModal, useSlotHold</text>

      <line x1="660" y1="576" x2="1156" y2="576" stroke="#d97706" stroke-opacity="0.18" stroke-width="1"/>

      <!-- Section 3: Architecture & Testing -->
      <rect x="660" y="585" width="3" height="30" rx="1.5" fill="#f59e0b"/>
      <text x="670" y="595" font-size="11.5" font-weight="700" fill="#78350f">Architecture &amp; Testing:</text>
      <text x="670" y="613" font-size="11.5" fill="#1e293b">28 ArchUnit rules, team test plan, concurrency &amp; PIT</text>
    </g>
  </g>

  <!-- ==================== GUTTER CONNECTORS & CENTER BADGE ==================== -->
  <g font-family='"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif'>

    <!-- Top gutter (Matei <-> Liviu): x=556..644, centered around y=216 -->
    <g id="connector-top">
      <line x1="560" y1="198" x2="640" y2="198" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 3" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
      <rect x="560" y="207" width="80" height="32" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="600" y="220" text-anchor="middle" font-size="9.5" font-weight="600" fill="#334155">CatalogApi</text>
      <text x="600" y="232" text-anchor="middle" font-size="9.5" font-weight="600" fill="#334155">LiveStreams</text>
    </g>

    <!-- Bottom gutter (Stefania <-> Calin): x=556..644, centered around y=512 -->
    <g id="connector-bottom">
      <line x1="560" y1="494" x2="640" y2="494" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 3" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
      <rect x="559" y="503" width="82" height="32" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="600" y="516" text-anchor="middle" font-size="9.5" font-weight="600" fill="#334155">AssetDamaged</text>
      <text x="600" y="528" text-anchor="middle" font-size="9.5" font-weight="600" fill="#334155">usedMinutes</text>
    </g>

    <!-- Left gutter (Matei <-> Stefania): x=292, y=340..388 -->
    <g id="connector-left">
      <line x1="292" y1="342" x2="292" y2="386" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 3" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
      <rect x="148" y="353" width="288" height="22" rx="11" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="292" y="367.5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">UserApi · CurrentUser · UserDisabledEvent</text>
    </g>

    <!-- Right gutter (Liviu <-> Calin): x=908, y=340..388 -->
    <g id="connector-right">
      <line x1="908" y1="342" x2="908" y2="386" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 3" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
      <rect x="748" y="353" width="320" height="22" rx="11" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="908" y="367.5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">CatalogApi.lockForBooking · AssetRetiredEvent</text>
    </g>

    <!-- Center badge: x=550..650, y=346..382 -->
    <g id="center-badge">
      <rect x="552" y="348" width="100" height="36" rx="18" fill="#0f172a" opacity="0.06"/>
      <rect x="550" y="346" width="100" height="36" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
      <text x="600" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">api/ &amp; events</text>
    </g>
  </g>

  <!-- ==================== BOTTOM CONTRACT STRIP (x=28..1172, y=656..758) ==================== -->
  <g id="contract-strip" font-family='"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif'>
    <!-- Offset shadow -->
    <rect x="32" y="660" width="1144" height="102" rx="12" fill="#0f172a" opacity="0.05"/>
    <!-- Container -->
    <rect x="28" y="656" width="1144" height="102" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Strip Header -->
    <text x="48" y="676" font-size="12.5" font-weight="700" fill="#0f172a">Cross-Module Integration Rules (enforced automatically by ArchUnit)</text>
    <text x="1152" y="676" text-anchor="end" font-size="10.5" fill="#64748b">solid border = api/ facade · dashed = domain event · color = owner</text>

    <!-- Row 1: 4 Public API Facades / Streams (y=686..712) -->
    <!-- Pill 1: UserApi (Matei - Blue) x=48..244 (w=196) -->
    <rect x="48" y="686" width="196" height="26" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <circle cx="62" cy="699" r="3.5" fill="#2563eb"/>
    <text x="72" y="703" font-size="11" fill="#1e3a8a"><tspan font-weight="700">UserApi</tspan> (Matei → all)</text>

    <!-- Pill 2: CatalogApi (Liviu - Teal) x=258..554 (w=296) -->
    <rect x="258" y="686" width="296" height="26" rx="13" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
    <circle cx="272" cy="699" r="3.5" fill="#0d9488"/>
    <text x="282" y="703" font-size="11" fill="#134e4a"><tspan font-weight="700">CatalogApi</tspan> (Liviu → res/inc/reas/proj)</text>

    <!-- Pill 3: ReservationApi (Calin - Amber) x=568..864 (w=296) -->
    <rect x="568" y="686" width="296" height="26" rx="13" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
    <circle cx="582" cy="699" r="3.5" fill="#d97706"/>
    <text x="592" y="703" font-size="11" fill="#78350f"><tspan font-weight="700">ReservationApi</tspan> (Calin → reas/inc/proj)</text>

    <!-- Pill 4: LiveStreams (Liviu - Teal) x=878..1152 (w=274) -->
    <rect x="878" y="686" width="274" height="26" rx="13" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
    <circle cx="892" cy="699" r="3.5" fill="#0d9488"/>
    <text x="902" y="703" font-size="11" fill="#134e4a"><tspan font-weight="700">LiveStreams</tspan> (Liviu → SES &amp; dev)</text>

    <!-- Row 2: 3 Domain Events (y=720..746) -->
    <!-- Pill 5: AssetDamagedEvent (Stefania - Violet) x=48..392 (w=344) -->
    <rect x="48" y="720" width="344" height="26" rx="13" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4 2.5"/>
    <circle cx="62" cy="733" r="3.5" fill="#7c3aed"/>
    <text x="72" y="737" font-size="11" fill="#4c1d95"><tspan font-weight="700">AssetDamagedEvent</tspan> (Stefania → Calin)</text>

    <!-- Pill 6: AssetRetiredEvent (Liviu - Teal) x=406..730 (w=324) -->
    <rect x="406" y="720" width="324" height="26" rx="13" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.2" stroke-dasharray="4 2.5"/>
    <circle cx="420" cy="733" r="3.5" fill="#0d9488"/>
    <text x="430" y="737" font-size="11" fill="#134e4a"><tspan font-weight="700">AssetRetiredEvent</tspan> (Liviu → Calin)</text>

    <!-- Pill 7: UserDisabledEvent (Stefania - Violet) x=744..1152 (w=408) -->
    <rect x="744" y="720" width="408" height="26" rx="13" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4 2.5"/>
    <circle cx="758" cy="733" r="3.5" fill="#7c3aed"/>
    <text x="768" y="737" font-size="11" fill="#4c1d95"><tspan font-weight="700">UserDisabledEvent</tspan> (Stefania → Calin &amp; Liviu)</text>
  </g>
</svg>
