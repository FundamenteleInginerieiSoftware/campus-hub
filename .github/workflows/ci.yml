name: ci

on:
  pull_request:
  push:
    branches: [main]

# The workflow only needs to read the code.
permissions:
  contents: read

# A new push to the same PR cancels the older, still-running build.
# Builds on main are never cancelled, so every merge gets a full result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci # this exact name is the required status check on main
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A real PostgreSQL 17 database that runs next to the job (a "service container").
    # The health check makes the job wait until the database accepts connections.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: campus
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus -d campus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Environment variables override the values in application-dev.yml,
    # so these replace the local H2 URL: @SpringBootTest and Flyway run against PostgreSQL.
    # @DataJpaTest tests still use their own embedded H2 database by design.
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/campus
      SPRING_DATASOURCE_USERNAME: campus
      SPRING_DATASOURCE_PASSWORD: campus

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify = compile, run tests, Spotless format check and JaCoCo coverage report.
      - name: Build and test backend
        working-directory: backend
        run: ./mvnw -B verify

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

      # Frontend steps are skipped until the frontend/ project exists.
      - name: Set up Node 24
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm run build
