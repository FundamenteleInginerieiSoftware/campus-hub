plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.4'
    id 'info.solidsoft.pitest' version '1.19.0' // mutation testing, on demand: ./gradlew pitest
}

group = 'com.campus'
version = '0.0.1-SNAPSHOT'
description = 'Campus Equipment and Incident Hub'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// Only Matei edits this file. Need a library? Open an issue with the "dependency" label.
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1' // 3.x is the line for Boot 4
    // AWS SDK v2 for photos (S3) and e-mails (SES), used only by the prod adapters. The BOM picks one
    // matching version for every AWS module, so s3 and sesv2 need no version of their own.
    implementation platform('software.amazon.awssdk:bom:2.57.0')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:sesv2'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // Calin's module-boundary rules (src/test/.../architecture/). Not in the Boot BOM, so it needs a version.
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// "build" runs spotlessCheck: it fails if the code isn't formatted. Fix with ./gradlew spotlessApply
spotless {
    java {
        palantirJavaFormat('2.102.0')
        removeUnusedImports()
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // Tests run with the "test" profile: local campus_test database (src/test/resources/application-test.yml).
    systemProperty 'spring.profiles.active', 'test'
    finalizedBy tasks.named('jacocoTestReport')
}

// Coverage report after every test run: build/reports/jacoco/test/html/index.html
tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

// Mutation testing (PIT), on demand only: ./gradlew pitest (about 3 min; PostgreSQL must run, like for build).
// Not part of "build" or CI: it reruns the tests once for every small change it makes.
// PIT changes our compiled code one small thing at a time (a "mutant": < becomes <=, a return value
// becomes null, a method call is removed) and reruns the tests that cover that line. If no test fails,
// the mutant "survived": that line could break and our tests wouldn't notice.
// Report: build/reports/pitest/index.html (mutations.xml for scripts).
pitest {
    pitestVersion = '1.30.1' // 1.30.x bundles ASM 9.11, which reads Java 25 class files
    junit5PluginVersion = '1.2.3'
    // The plugin would add its own JUnit launcher, older than Boot 4's JUnit 6, and then find no tests.
    // We already declare junit-platform-launcher above, so the BOM's matching version is used.
    addJUnitPlatformLauncher = false
    targetClasses = ['com.campus.*']
    // Code where a mutant means nothing: the main class, dev seed data and pure bean wiring.
    excludedClasses = [
        'com.campus.CampusHubApplication',
        'com.campus.*Seeder',
        'com.campus.config.AsyncConfig',
        'com.campus.config.AwsConfig',
        'com.campus.config.OpenApiConfig',
    ]
    // SecurityConfig's @Bean methods run once, when Spring starts. PIT runs many mutants in one JVM and
    // Spring reuses the context it already started, so these mutants always "survive" even though a
    // broken bean would stop the app. The lambdas inside them run on every request and stay mutated.
    excludedMethods = [
        'apiChain',
        'requestRejectedHandler',
        'passwordEncoder',
        'jwtEncoder',
        'jwtDecoder',
        'secretKey',
        'ignoreTokenOnAuthPaths',
        'activeUserFromToken',
    ]
    // Unit tests, the @WebMvcTest/@DataJpaTest slices and the MockMvc tests of config/ (the only tests
    // of SecurityConfig and SpaConfig). Left out: *IT (threads, rollbacks, full flows: slow), ArchUnit
    // rules (they read classes, never run them) and tests that only check that the app starts.
    excludedTestClasses = [
        'com.campus.*IT',
        'com.campus.architecture.*',
        'com.campus.CampusHubApplicationTests',
        'com.campus.config.AsyncConfigTest',
        'com.campus.config.ProdProfileStartupTest',
    ]
    threads = Runtime.runtime.availableProcessors()
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    // Same "test" profile and campus_test database as the test task.
    jvmArgs = ['-Dspring.profiles.active=test']
}
