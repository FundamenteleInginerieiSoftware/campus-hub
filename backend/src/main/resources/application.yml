spring:
  application:
    name: campus-hub
  profiles:
    default: dev            # "default", not "active", so prod (and tests) can override it
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate    # Flyway creates tables; Hibernate only checks them
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # Bug fixed: spring.mvc.problemdetails.enabled=true added Spring Boot's own error handler, which runs
  # before Liviu's GlobalExceptionHandler, so validation errors, bad JSON and unknown paths came back
  # without our "code" (and without the "errors" field list). Left off, every error goes through Liviu's handler.
  task:
    execution:
      thread-name-prefix: campus-async-   # shows in the logs which lines came from an @Async listener
      pool:
        core-size: 4        # fast work (reassignment, live SSE); slow SES calls run on campus-ses- in AsyncConfig
        allow-core-thread-timeout: true
    # Spring runs every @Scheduled method on ONE thread by default. Liviu's SSE heartbeat (every 20 s) would wait
    # behind Calin's sweeps (no-show/overdue every 5 min, which also send emails; holds every minute), and a slow
    # sweep would stop the heartbeats, so CloudFront closes idle live-toast streams after 30 s.
    # 3 threads: the heartbeat still gets one even when two sweeps run at the same time.
    scheduling:
      thread-name-prefix: campus-sched-
      pool:
        size: 3

springdoc:
  default-produces-media-type: application/json   # Swagger showed "*/*" for every response; all of ours are JSON

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  time-zone: Europe/Bucharest
  jwt:
    expiration: 8h
  messaging:
    sqs:
      enabled: false        # stretch goal: true switches the reassignment trigger from the local listener to SQS
