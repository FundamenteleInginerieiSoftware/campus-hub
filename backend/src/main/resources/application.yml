spring:
  application:
    name: campus-hub
  profiles:
    default: dev            # "default", not "active", so prod can override it
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate    # Flyway creates tables; Hibernate only checks them
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  time-zone: Europe/Bucharest
  jwt:
    expiration: 8h
