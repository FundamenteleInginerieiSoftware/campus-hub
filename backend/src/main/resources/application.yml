spring:
  application:
    name: campus-hub
  profiles:
    default: dev            # "default", not "active", so prod (and tests) can override it
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate    # Flyway creates tables; Hibernate only checks them
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # Bug fixed: spring.mvc.problemdetails.enabled=true added Spring Boot's own error handler, which runs
  # before Liviu's GlobalExceptionHandler, so validation errors, bad JSON and unknown paths came back
  # without our "code" (and without the "errors" field list). Left off, every error goes through Liviu's handler.
  task:
    execution:
      thread-name-prefix: campus-async-   # shows in the logs which lines came from an @Async listener
      pool:
        core-size: 2        # small: only a few listeners (reassignment, notifications) run in the background

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  time-zone: Europe/Bucharest
  jwt:
    expiration: 8h
  messaging:
    sqs:
      enabled: false        # stretch goal: true switches the reassignment trigger from the local listener to SQS
