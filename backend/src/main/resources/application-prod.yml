# Every value comes from environment variables (set by Matei on AWS). No secrets in git.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  aws-region: ${AWS_REGION}
  jwt:
    secret: ${JWT_SECRET}
  storage:
    photo-bucket: ${PHOTO_BUCKET}
  messaging:
    queue-url: ${SQS_QUEUE_URL:}     # only needed once the SQS stretch goal is on
  mail:
    from: ${MAIL_FROM}
  admin:
    email: ${ADMIN_EMAIL:}        # ":" = empty default; admin is bootstrapped only if set
    password: ${ADMIN_PASSWORD:}
